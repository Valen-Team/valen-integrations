[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langchain-valen"
version = "0.1.0"
description = "Typed Valen decisions and uncertainty-aware routing for LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["langchain-core>=1.0,<2", "valen-sdk>=0.3.1,<0.4"]

[project.optional-dependencies]
test = ["pytest>=8", "langgraph>=1,<2", "build>=1", "twine>=6,<7"]

[project.urls]
Repository = "https://github.com/Valen-Team/valen-integrations"
Documentation = "https://github.com/Valen-Team/valen-integrations/tree/main/langchain"

[tool.hatch.build.targets.wheel]
packages = ["langchain_valen"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
